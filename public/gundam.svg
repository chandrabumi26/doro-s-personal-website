<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Gundam Head Icon - Stylized RX-78-2 -->
  <!-- Main head shape -->
  <polygon points="50,8 75,30 72,75 28,75 25,30" fill="#E8E8E8" stroke="#333" stroke-width="2"/>
  <!-- V-Fin (antenna) -->
  <polygon points="50,8 42,2 38,18 48,14" fill="#FFD700" stroke="#333" stroke-width="1"/>
  <polygon points="50,8 58,2 62,18 52,14" fill="#FFD700" stroke="#333" stroke-width="1"/>
  <!-- Forehead red piece -->
  <polygon points="42,18 58,18 54,32 46,32" fill="#E53E3E"/>
  <!-- Center crest -->
  <rect x="47" y="10" width="6" height="10" fill="#E8E8E8" stroke="#333" stroke-width="1"/>
  <!-- Eyes visor -->
  <polygon points="30,38 70,38 68,48 32,48" fill="#1A1A2E"/>
  <!-- Left eye -->
  <polygon points="34,40 48,40 47,46 35,46" fill="#FFD700"/>
  <!-- Right eye -->
  <polygon points="52,40 66,40 65,46 53,46" fill="#FFD700"/>
  <!-- Chin/mouth area -->
  <polygon points="38,55 62,55 60,68 40,68" fill="#D4D4D4" stroke="#333" stroke-width="1"/>
  <!-- Chin vent -->
  <line x1="45" y1="58" x2="45" y2="64" stroke="#888" stroke-width="1.5"/>
  <line x1="50" y1="58" x2="50" y2="64" stroke="#888" stroke-width="1.5"/>
  <line x1="55" y1="58" x2="55" y2="64" stroke="#888" stroke-width="1.5"/>
  <!-- Red chin piece -->
  <polygon points="46,68 54,68 52,78 48,78" fill="#E53E3E"/>
  <!-- Side vents left -->
  <rect x="22" y="40" width="6" height="4" fill="#333"/>
  <rect x="22" y="46" width="6" height="4" fill="#333"/>
  <rect x="22" y="52" width="6" height="4" fill="#333"/>
  <!-- Side vents right -->
  <rect x="72" y="40" width="6" height="4" fill="#333"/>
  <rect x="72" y="46" width="6" height="4" fill="#333"/>
  <rect x="72" y="52" width="6" height="4" fill="#333"/>
</svg>
